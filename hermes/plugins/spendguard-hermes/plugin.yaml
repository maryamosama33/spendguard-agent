name: spendguard-hermes
version: "0.3.0"
description: "SpendGuard guardrails for Hermes: (1) the owner decides — approve_expense/reject_expense are blocked in the same turn an expense arrives, and (with SPENDGUARD_OWNER_IDS set) for any sender who isn't an owner; (2) SpendGuard's ready-made Egyptian Arabic reply (reply_to_sender / reply_to_owner / reply) is delivered verbatim instead of the model's paraphrase."
author: "SpendGuard"
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - transform_llm_output
