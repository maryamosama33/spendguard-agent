# Hermes config for the "spendguard" profile.
#
# Don't install by hand: `python scripts/spendguard.py setup` fills in
# {{PYTHON}} / {{REPO_ROOT}}, installs this as the "spendguard" Hermes profile
# (keys go in the profile's .env, copied from this repo's .env), and enables the
# guardrails plugin. Hermes fills every key not set here with its defaults.
#
# The profile's .env holds GROQ_API_KEY and, for the Telegram bot,
# TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_USERS (comma-separated numeric user IDs;
# or approve newcomers with `hermes -p spendguard pairing approve telegram
# <CODE>`) and TELEGRAM_HOME_CHANNEL (the owner's chat ID). SpendGuard loads its
# own .env (GEMINI_API_KEY, GOOGLE_*) from the repo. No secrets live here.
#
# `scripts/spendguard.py chat|bot` run Hermes from the profile's workspace
# folder, outside this repo: inside a code repo Hermes switches to coding-agent
# mode and loads CLAUDE.md, which roughly doubles the prompt and breaks Groq's
# free 8K tokens/min budget.

# Chat model: Groq free tier. Gemini is used only inside SpendGuard's
# extract_expense tool for invoice reading.
model:
  default: "qwen/qwen3.8-27b"
  provider: "groq"

providers:
  groq:
    base_url: "https://api.groq.com/openai/v1"
    key_env: "GROQ_API_KEY"
    api_mode: chat_completions
    # Groq's Qwen models accept reasoning_effort only as "none"/"default".
    # (openai/gpt-oss-120b needs low/medium/high here instead: Hermes always
    # sends "default" to api.groq.com and gpt-oss rejects it with HTTP 400.)
    extra_body:
      reasoning_effort: default
  # Same endpoint for the fallback: gpt-oss-120b has its own daily quota but
  # needs reasoning_effort low/medium/high.
  groq-oss:
    base_url: "https://api.groq.com/openai/v1"
    key_env: "GROQ_API_KEY"
    api_mode: chat_completions
    extra_body:
      reasoning_effort: medium

# Qwen's free tier is 200K tokens/day (about 7 complete expenses); then continue
# on gpt-oss-120b. The spendguard-hermes plugin keeps it from deciding itself.
fallback_providers:
  - provider: groq-oss
    model: openai/gpt-oss-120b

agent:
  # Hermes doesn't parse Groq's "try again in Ns" text; enough attempts for its
  # 2-4-8-16-32s backoff to span a full 1-minute token window.
  api_max_retries: 6
  # Hermes's generic "keep calling tools / report what execution returned"
  # blocks make the model wrap SpendGuard's replies in its own report.
  tool_use_enforcement: false
  execution_guidance: false

# Guardrails plugin (hermes/plugins/spendguard-hermes, shipped in the profile):
# owner-only approve/reject, and SpendGuard's replies delivered verbatim.
plugins:
  enabled:
    - spendguard-hermes

mcp_servers:
  spendguard:
    command: "{{PYTHON}}"
    args: ["-m", "spendguard.server"]
    # Hermes spawns this without a working directory, so the repo root must be
    # on PYTHONPATH for `-m spendguard.server` to resolve.
    env:
      PYTHONPATH: "{{REPO_ROOT}}"
    # extract_expense may wait up to ~60s on its Gemini rate limiter plus retries.
    timeout: 300
    tools:
      # SpendGuard serves no MCP prompts/resources; don't send Hermes's 4
      # generated list/get/read utility tools to the model.
      resources: false
      prompts: false

# Only SpendGuard's 7 tools (F26): no terminal/file/web/browser built-ins. An
# empty list leaves just the MCP server's tools. Equivalent:
#   hermes tools disable --platform cli web browser terminal file code_execution \
#     vision image_gen tts skills todo memory session_search connections clarify \
#     delegation cronjob computer_use
platform_toolsets:
  cli: []
  telegram: []

# Telegram users should see only SpendGuard's Egyptian Arabic reply: no mid-turn
# model narration (it came out in English), no Hermes warning notices
# (fallback/retry), no reasoning or tool rows; status bubbles are deleted once
# the reply lands. Streaming stays off, or Telegram shows the model's draft
# before the plugin swaps in SpendGuard's text.
streaming:
  enabled: false

display:
  platforms:
    telegram:
      interim_assistant_messages: false
      suppress_warning_notifications: true
      show_reasoning: false
      tool_progress: "off"
      cleanup_progress: true

tools:
  # Expose the 7 tools directly instead of behind tool_search/tool_describe/
  # tool_call (fewer model calls per tool use).
  tool_search:
    enabled: "off"

auxiliary:
  # Session titles cost an extra Groq call per session; not needed.
  title_generation:
    enabled: false

# Voice notes (F02): Groq Whisper (free, separate audio quota) in Arabic.
# Tested on an Egyptian-Arabic clip: word-for-word transcript.
stt:
  enabled: true
  provider: "groq"
  language: "ar"
  # Vocabulary hint so Whisper spells project/supplier names right.
  prompt: "طلب صرف، جنيه، فاتورة، حديد تسليح، أسمنت، رمل، نقل، عمالة، مقاول، فيلات التجمع الخامس، مستودع 6 أكتوبر، موقع العاصمة الإدارية، النصر للنقل والتوريدات، مصنع الحديد الوطني، شركة أسمنت السويس"
  groq:
    model: "whisper-large-v3-turbo"
