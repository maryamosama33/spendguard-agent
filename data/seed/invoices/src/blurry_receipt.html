<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  /* A badly taken phone photo: dark, blurred, tilted (demo for F08). */
  html, body { margin: 0; background: #1f1c18; overflow: hidden; }
  .paper {
    width: 560px; margin: 60px auto; padding: 30px 36px; background: #b9b3a6;
    transform: rotate(-9deg); filter: blur(5px) brightness(0.55);
    font-family: Tahoma, sans-serif; color: #333; font-size: 15px;
  }
  .co { font-size: 22px; font-weight: bold; text-align: center; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  td, th { border: 1px solid #777; padding: 7px; text-align: center; }
</style>
</head>
<body>
  <div class="paper">
    <div class="co">شركة أسمنت السويس</div>
    <p>رقم الفاتورة: SC-1152 &nbsp; التاريخ: 2026-10-01</p>
    <table>
      <tr><th>البيان</th><th>الكمية</th><th>الإجمالي</th></tr>
      <tr><td>أسمنت</td><td>1 طن</td><td>1,240</td></tr>
    </table>
    <p>الإجمالي: 1,240 ج.م</p>
  </div>
</body>
</html>
