<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #3d3d3d; }
  .paper {
    width: 620px; margin: 40px auto; padding: 30px 36px; background: #fdfdfb;
    box-shadow: 6px 10px 20px rgba(0,0,0,.5); transform: rotate(2deg);
    font-family: Tahoma, sans-serif; color: #222; font-size: 15px;
  }
  .co { font-size: 22px; font-weight: bold; color: #7a2e0e; text-align: center; }
  .muted { color: #666; font-size: 12px; text-align: center; margin-bottom: 14px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  td, th { border: 1px solid #aaa; padding: 7px; text-align: center; }
  th { background: #f3e7df; }
  .meta td { border: none; text-align: right; padding: 3px 0; }
  .total { margin-top: 12px; font-weight: bold; font-size: 17px; }
</style>
</head>
<body>
  <div class="paper">
    <div class="co">شركة أسمنت السويس</div>
    <div class="muted">فاتورة مبيعات</div>
    <table class="meta">
      <tr><td><b>رقم الفاتورة:</b> SC-1140</td><td><b>التاريخ:</b> 2026-09-10</td></tr>
      <tr><td><b>المشروع:</b> مستودع 6 أكتوبر</td><td><b>المستلم:</b> أحمد علي</td></tr>
    </table>
    <table>
      <tr><th>البيان</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>
      <tr><td>أسمنت بورتلاندي (cement)</td><td>1 طن</td><td>1,220</td><td>1,220</td></tr>
    </table>
    <div class="total">الإجمالي: 1,220 ج.م</div>
  </div>
</body>
</html>
