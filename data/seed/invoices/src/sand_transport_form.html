<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #6b5a48; }
  .paper {
    width: 640px; margin: 50px auto; padding: 36px 44px;
    background: linear-gradient(160deg, #fbf6e9 0%, #efe6cf 60%, #ddd2b6 100%);
    box-shadow: 8px 12px 24px rgba(0,0,0,.45);
    transform: rotate(-3.5deg);
    font-family: "Simplified Arabic", Tahoma, sans-serif; color: #333;
  }
  h2 { text-align: center; margin: 0 0 22px; font-size: 26px; }
  .row { display: flex; align-items: baseline; margin: 18px 0; font-size: 19px; }
  .label { width: 150px; }
  .line { flex: 1; border-bottom: 1px dotted #555; min-height: 34px; }
  .hand { font-family: "Aldhabi", "Andalus", serif; font-size: 34px; color: #1a3a8a; padding-right: 10px; }
  .sig { margin-top: 30px; font-size: 17px; }
</style>
</head>
<body>
  <div class="paper">
    <h2>نموذج طلب صرف</h2>
    <div class="row"><span class="label">التاريخ:</span><span class="line hand">1 / 10 / 2026</span></div>
    <div class="row"><span class="label">اسم الطالب:</span><span class="line hand">محمد حسن</span></div>
    <div class="row"><span class="label">المشروع:</span><span class="line hand"></span></div>
    <div class="row"><span class="label">المورد:</span><span class="line hand">النصر للنقل والتوريدات</span></div>
    <div class="row"><span class="label">البيان:</span><span class="line hand">نقل رمل - نقلة واحدة</span></div>
    <div class="row"><span class="label">المبلغ:</span><span class="line hand">860 جنيه</span></div>
    <div class="sig">توقيع المهندس: <span class="hand">م. حسن</span></div>
  </div>
</body>
</html>
